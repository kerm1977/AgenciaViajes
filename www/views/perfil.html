<!-- perfil.html — página personal: datos de cuenta, ajustes y estadísticas -->
<div class="card card-pad" style="max-width:640px;margin-bottom:1rem">
  <div class="flex gap2" style="align-items:center">
    <div class="avatar" id="pf-avatar"
         style="width:56px;height:56px;font-size:1.3rem">?</div>
    <div style="flex:1;min-width:0">
      <h3 id="pf-nombre" class="bold">—</h3>
      <p class="muted text-sm truncate" id="pf-email">—</p>
      <div class="flex gap1" style="align-items:center;margin-top:.25rem">
        <span class="rol-chip rol-user" id="pf-rol">usuario</span>
        <span class="rol-chip" id="pf-estado"
              style="background:var(--sky-50);color:var(--sky-600)">—</span>
      </div>
    </div>
  </div>
  <h4 class="lbl" style="margin-top:1rem">Privilegios</h4>
  <div id="pf-priv" class="flex gap1" style="flex-wrap:wrap"></div>
</div>

<div class="card card-pad" style="max-width:640px;margin-bottom:1rem">
  <h4 class="lbl" style="margin-bottom:.75rem">
    <i class="fa-solid fa-gear" style="color:var(--brand-600)"></i> Acciones</h4>
  <div class="flex gap2" style="flex-wrap:wrap">
    <button class="btn btn-soft" onclick="Perfil.ajustes()">
      <i class="fa-solid fa-folder-open"></i> Ajustes · Uploader</button>
    <button class="btn btn-soft" onclick="Perfil.stats()">
      <i class="fa-solid fa-chart-pie"></i> Estadísticas</button>
    <button class="btn btn-soft" onclick="Perfil.cuentas()">
      <i class="fa-solid fa-credit-card"></i> Cuentas</button>
    <button class="btn btn-soft" onclick="Vuelos.render()">
      <i class="fa-solid fa-plane"></i> Vuelos</button>
  </div>
  <div id="pf-ajustes" class="hidden mt2"></div>
</div>
<div id="pf-stats" class="hidden"></div>

<div id="modal-cuentas" class="modal">
  <div class="modal-box" style="max-width:24rem">
    <div class="modal-head">
      <h3><i class="fa-solid fa-credit-card" style="color:var(--brand-600)"></i> Cuentas y números</h3>
      <button class="modal-x" onclick="closeModal('modal-cuentas')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <h4 class="lbl"><i class="fa-solid fa-mobile-screen" style="color:#25D366"></i> SINPE Móvil</h4>
      <ul id="ct-sinpe" class="pit-ol" style="margin-bottom:.4rem"></ul>
      <div class="flex gap1">
        <input id="ct-ns" class="input" inputmode="numeric" placeholder="Nuevo número SINPE">
        <button class="btn btn-soft" onclick="Perfil.ctAdd('sinpe')"><i class="fa-solid fa-plus"></i></button>
      </div>
      <h4 class="lbl" style="margin-top:.8rem"><i class="fa-solid fa-building-columns" style="color:var(--sky-600)"></i> Cuentas bancarias</h4>
      <ul id="ct-ctas" class="pit-ol" style="margin-bottom:.4rem"></ul>
      <div class="flex gap1">
        <input id="ct-nc" class="input" placeholder="Nueva cuenta bancaria">
        <button class="btn btn-soft" onclick="Perfil.ctAdd('cuentas')"><i class="fa-solid fa-plus"></i></button>
      </div>
    </div>
  </div>
</div>
<div id="modal-vuelos" class="modal">
  <div class="modal-box" style="max-width:26rem">
    <div class="modal-head">
      <h3><i class="fa-solid fa-plane" style="color:var(--brand-600)"></i> Vuelos baratos</h3>
      <button class="modal-x" onclick="closeModal('modal-vuelos')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:.5rem">
        <div><h4 class="lbl">Origen</h4><select id="vu-o" class="select"></select></div>
        <div><h4 class="lbl">Destino</h4><select id="vu-d" class="select"></select></div>
        <div><h4 class="lbl">Ida</h4><input id="vu-i" type="date" class="input"></div>
        <div><h4 class="lbl">Regreso (opcional)</h4><input id="vu-v" type="date" class="input"></div>
      </div>
      <h4 class="lbl" style="margin-top:.8rem">Comparadores</h4>
      <div id="vu-agg" class="grid" style="gap:.35rem"></div>
      <h4 class="lbl" style="margin-top:.8rem">Aerolíneas</h4>
      <div id="vu-aer" class="grid" style="gap:.35rem"></div>
      <h4 class="lbl" style="margin-top:.8rem">Mejores momentos para comprar</h4>
      <ul class="pit-ol muted text-sm" id="vu-tips"></ul>
    </div>
  </div>
</div>
<div style="max-width:640px;margin-top:1rem">
  <button class="btn btn-soft" style="width:100%;color:var(--rose-600)"
          onclick="Auth.salir()">
    <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
</div>
