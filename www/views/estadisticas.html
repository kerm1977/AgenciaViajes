<!-- estadisticas.html — resumen, gráficos y respaldo/exportación -->
<div class="grid-cards" style="margin-bottom:1.5rem">
  <div class="card stat-card">
    <div><p>Destinos / Caminatas</p><h3 id="stat-destinos">0</h3></div>
    <div class="stat-ico" style="background:var(--brand-50);color:var(--brand-600)"><i class="fa-solid fa-map"></i></div>
  </div>
  <div class="card stat-card">
    <div><p>Contactos</p><h3 id="stat-contactos">0</h3></div>
    <div class="stat-ico" style="background:var(--sky-50);color:var(--sky-600)"><i class="fa-solid fa-address-book"></i></div>
  </div>
  <div class="card stat-card">
    <div><p>Pasajeros</p><h3 id="stat-pasajeros">0</h3></div>
    <div class="stat-ico" style="background:var(--purple-50);color:var(--purple-600)"><i class="fa-solid fa-users"></i></div>
  </div>
  <div class="card stat-card">
    <div><p>Usuarios del sistema</p><h3 id="stat-usuarios">0</h3></div>
    <div class="stat-ico" style="background:var(--amber-50);color:var(--amber-600)"><i class="fa-solid fa-user-gear"></i></div>
  </div>
  <div class="card stat-card">
    <div><p>Imágenes en Uploader</p><h3 id="stat-imagenes">0</h3></div>
    <div class="stat-ico" style="background:var(--rose-50);color:var(--rose-600)"><i class="fa-solid fa-images"></i></div>
  </div>
</div>

<div class="grid-2" style="margin-bottom:1.5rem">
  <div class="card card-pad">
    <h4 class="lbl" style="margin-bottom:.75rem"><i class="fa-solid fa-chart-pie" style="color:var(--brand-600)"></i> Contactos por tipo</h4>
    <canvas id="chart-pie" style="width:100%;height:220px"></canvas>
  </div>
  <div class="card card-pad">
    <h4 class="lbl" style="margin-bottom:.75rem"><i class="fa-solid fa-chart-column" style="color:var(--brand-600)"></i> Pasajeros por destino</h4>
    <canvas id="chart-barras" style="width:100%;height:220px"></canvas>
  </div>
</div>

<div class="card card-pad">
  <h4 class="lbl" style="margin-bottom:.75rem"><i class="fa-solid fa-toolbox" style="color:var(--brand-600)"></i> Acciones del sistema</h4>
  <div class="flex gap2" style="flex-wrap:wrap">
    <button class="btn btn-soft" onclick="Exportar.json()"><i class="fa-solid fa-download" style="color:var(--brand-600)"></i> Exportar JSON (backup)</button>
    <label class="btn btn-soft" style="cursor:pointer"><i class="fa-solid fa-upload" style="color:var(--sky-600)"></i> Importar JSON
      <input type="file" accept=".json" class="hidden" onchange="Exportar.importarJSON(event)"></label>
    <button class="btn btn-soft" onclick="Exportar.pdf()"><i class="fa-solid fa-file-pdf" style="color:var(--rose-600)"></i> Reporte PDF</button>
    <button class="btn btn-soft" onclick="Exportar.txt()"><i class="fa-solid fa-file-lines" style="color:var(--slate-600)"></i> Exportar TXT</button>
    <button class="btn btn-soft" onclick="Exportar.whatsapp()"><i class="fa-brands fa-whatsapp" style="color:#25d366"></i> Compartir por WhatsApp</button>
    <button class="btn btn-soft" onclick="Exportar.sqliteExport()"><i class="fa-solid fa-database" style="color:var(--purple-600)"></i> Exportar BD SQLite</button>
    <label class="btn btn-soft" style="cursor:pointer"><i class="fa-solid fa-database" style="color:var(--sky-600)"></i> Importar BD
      <input type="file" accept=".json,.sqlite,.db" class="hidden" onchange="Exportar.importarBD(event)"></label>
  </div>
  <p class="hint mt2">Todo funciona sin internet; los respaldos JSON incluyen
    usuarios, contactos, destinos y pasajeros.</p>
</div>
